<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Arulz-XD API</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0c10;
        }
        .bg-gradient-blur {
            background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
        }
        :root {
            --neon-cyan: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.4);
            --bg-dark: #030712;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-color: rgba(0, 243, 255, 0.2);
        }

        /* Support Light Theme Mode */
        html.light {
            --neon-cyan: #008b9b;
            --neon-glow: rgba(0, 139, 155, 0.25);
            --bg-dark: #f0fdfa;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 139, 155, 0.3);
        }

        #cyber-loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        #cyber-loader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Laser Scanner Beam */
        .scanner-beam {
            position: absolute;
            top: 0;
            left: -100%;
            width: 300%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.05), transparent);
            animation: scanAnimation 4s infinite linear;
        }
        @keyframes scanAnimation {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Concentric Hologram HUD Rotating Rings */
        .hud-ring {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed var(--neon-cyan);
            opacity: 0.6;
            animation: spinClockwise 10s linear infinite;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .ring-middle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
            animation: spinCounterClockwise 4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .ring-inner {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 1px dotted var(--neon-cyan);
            opacity: 0.8;
            animation: spinClockwise 6s linear infinite;
        }

        .hud-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            z-index: 10;
        }

        @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 100% { transform: rotate(-360deg); } }

        /* Animated Dot Pulse */
        .animated-dots::after {
            content: '';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotsAnimation 1.5s steps(4, end) infinite;
        }
        @keyframes dotsAnimation {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .neon-progress-bar {
            background: linear-gradient(90deg, #06b6d4, var(--neon-cyan));
            box-shadow: 0 0 12px var(--neon-cyan);
            transition: width 0.15s ease-out;
        }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen relative overflow-x-hidden antialiased">

    <div id="cyber-loader-overlay">
        <div class="scanner-beam"></div>

        <!-- Central Holographic HUD Ring Spinner -->
        <div class="hud-ring mb-6">
            <div class="ring-outer"></div>
            <div class="ring-middle"></div>
            <div class="ring-inner"></div>
            <img src="https://arulz-xd.my.id/files/Q2C70y.png" alt="Logo" class="hud-avatar">
        </div>

        <!-- Dynamic Page Name & Animated Dot Text -->
        <div class="text-center px-4">
            <div id="loader-title-text" class="text-sm font-extrabold tracking-widest uppercase text-cyan-400 code-font mb-1">
                Memuat Halaman<span class="animated-dots"></span>
            </div>
            <div class="text-[10px] text-slate-400 font-mono tracking-wider opacity-80 uppercase">
                SYSTEM INITIALIZING // CORE GATEWAY
            </div>
        </div>

        <!-- Progress Bar (0% - 100%) -->
        <div class="w-64 sm:w-80 mt-6">
            <div class="flex items-center justify-between text-xs font-bold code-font mb-2">
                <span class="text-slate-400 text-[10px]">SYSTEM STATUS</span>
                <span id="loader-percentage" class="text-cyan-400 text-sm">0%</span>
            </div>
            <div class="w-full h-2 bg-slate-900/90 rounded-full border border-cyan-500/30 overflow-hidden p-0.5">
                <div id="loader-progress-fill" class="h-full rounded-full neon-progress-bar w-0"></div>
            </div>
        </div>

        <div class="absolute bottom-6 text-[10px] font-mono text-slate-500 uppercase tracking-widest">
            Arulz-XD API v2.0
        </div>
    </div>

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-gradient-blur pointer-events-none z-0"></div>

    <div class="container max-w-3xl mx-auto px-4 py-12 relative z-10">
        
        <div class="mb-8">
            <a href="/docs" class="inline-flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-cyan-500/50 rounded-xl text-slate-300 hover:text-cyan-400 transition-all text-sm font-medium backdrop-blur-md shadow-lg group">
                <svg class="w-4 h-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span id="lbl-btn-back">Kembali</span>
            </a>
        </div>

        <header class="mb-10 text-center md:text-left">
            <h1 id="lbl-main-title" class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                Kebijakan Privasi
            </h1>
            <p id="lbl-updated" class="text-xs font-mono text-cyan-400/80 uppercase tracking-widest">
                Terakhir Diperbarui: 29 Juni 2026
            </p>
        </header>

        <main id="policy-list-container" class="space-y-6">
            <div class="p-6 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-md animate-pulse h-32"></div>
        </main>

        <footer class="mt-12 pt-8 border-t border-white/15 text-center">
            <h3 id="lbl-footer-title" class="text-sm font-semibold text-slate-300 mb-2">Punya pertanyaan atau kendala?</h3>
            <p id="lbl-footer-desc" class="text-xs text-slate-400 font-medium">
                Hubungi tim support teknis melalui email resmi kami di: 
                <a href="mailto:supportarulzxd@gmail.com" class="text-cyan-400 hover:underline font-mono">supportarulzxd@gmail.com</a>
            </p>
        </footer>
    </div>

    <script>
        const docTranslations = {
            id: {
                btnBack: "Kembali ke Beranda",
                mainTitle: "Kebijakan Privasi",
                updated: "Terakhir Diperbarui: 29 Juni 2026",
                footerTitle: "Punya pertanyaan atau kendala?",
                footerDesc: "Hubungi tim support teknis melalui email resmi kami di:",
                items: [
                    "<strong>1. Pengumpulan Data:</strong> Kami tidak menyimpan data pribadi pengguna di database server kami. Semua data unggahan file yang diproses melalui sistem <a href='/uploader' class='text-cyan-400 hover:underline'>Uploader</a> langsung diteruskan ke penyimpanan terisolasi yang aman dan otomatis dibersihkan secara berkala.",
                    "<strong>2. Penyimpanan Browser:</strong> Kami memanfaatkan fitur media <i>local storage</i> pada aplikasi browser Anda secara aman murni hanya untuk menyimpan konfigurasi preferensi pilihan bahasa utama (ID/EN) serta riwayat autentikasi API Key jika ada.",
                    "<strong>3. Penggunaan Cookie:</strong> Kami sama sekali tidak memasang cookie pelacak pihak ketiga yang mengganggu. Semua aktivitas interaksi ngoding Anda berjalan murni secara efisien dan transparan.",
                    "<strong>4. Transaksi & Dukungan Donasi:</strong> Data pembayaran melalui layanan <a href='/store' class='text-cyan-400 hover:underline'>Store</a> maupun <a href='/support' class='text-cyan-400 hover:underline'>Donasi Support</a> dikelola melalui lisensi gateway resmi dan tidak digunakan untuk keperluan pemasaran ulang yang melanggar hukum.",
                    "<strong>5. Dasar Hukum & Kepatuhan UU PDP:</strong> Pengelolaan sistem Arulz-XD API tunduk pada ketentuan Undang-Undang Republik Indonesia No. 27 Tahun 2022 tentang Perlindungan Data Pribadi (UU PDP) dan UU ITE untuk menjamin privasi, keamanan digital, serta pemrosesan data yang adil bagi seluruh developer.",
                    "<strong>6. Keamanan Server & Endpoint:</strong> Seluruh komunikasi lalu lintas data dari <a href='/docs' class='text-cyan-400 hover:underline'>Dokumentasi API</a> dilindungi oleh enkripsi SSL/TLS standar industri demi menjaga kerahasiaan payload saat request dikirimkan."
                ]
            },
            en: {
                btnBack: "Back to Home",
                mainTitle: "Privacy Policy",
                updated: "Last Updated: June 29, 2026",
                footerTitle: "Have any questions or concerns?",
                footerDesc: "Contact our technical support team via our official email at:",
                items: [
                    "<strong>1. Data Collection:</strong> We do not store any personal user data on our server databases. All file upload actions processed through the <a href='/uploader' class='text-cyan-400 hover:underline'>Uploader</a> system are directly forwarded to secure, isolated storage and automatically wiped periodically.",
                    "<strong>2. Browser Storage:</strong> We securely use your browser's local storage media to store your preferred language configuration preferences (ID/EN) and local API Key session status.",
                    "<strong>3. Cookie Usage:</strong> We do not deploy intrusive third-party tracking cookies. All your coding interactions run purely in an efficient and transparent manner.",
                    "<strong>4. Store Transactions & Support:</strong> Payment data processed via our <a href='/store' class='text-cyan-400 hover:underline'>Store</a> or <a href='/support' class='text-cyan-400 hover:underline'>Support Donation</a> portals are safely handled via official payment gateways and will never be used for unauthorized remarketing.",
                    "<strong>5. Legal Compliance & PDP Law:</strong> Operations on Arulz-XD API strictly adhere to Law No. 27 of 2022 concerning Personal Data Protection (UU PDP) and the ITE Law of the Republic of Indonesia to guarantee developer privacy, digital security, and fair processing.",
                    "<strong>6. Server & Endpoint Security:</strong> All traffic from <a href='/docs' class='text-cyan-400 hover:underline'>API Documentation</a> endpoints is encrypted via industry-standard SSL/TLS protocols to ensure payload confidentiality during transmissions."
                ]
            }
        };

        let currentLang = localStorage.getItem('arulzxd_lang') || 'id';

        function renderPrivacyContent() {
            const data = docTranslations[currentLang] || docTranslations['id'];
            
            document.getElementById('lbl-btn-back').innerText = data.btnBack;
            document.getElementById('lbl-main-title').innerText = data.mainTitle;
            document.getElementById('lbl-updated').innerText = data.updated;
            document.getElementById('lbl-footer-title').innerText = data.footerTitle;
            
            document.getElementById('lbl-footer-desc').innerHTML = `${data.footerDesc} <a href="mailto:supportarulzxd@gmail.com" class="text-cyan-400 hover:underline font-mono">supportarulzxd@gmail.com</a>`;

            const listContainer = document.getElementById('policy-list-container');
            listContainer.innerHTML = '';
            
            data.items.forEach(text => {
                const box = document.createElement('div');
                box.className = 'p-6 bg-white/5 border border-white/10 hover:border-cyan-500/30 rounded-2xl backdrop-blur-md transition-all duration-300 text-slate-300 leading-relaxed text-sm md:text-base';
                box.innerHTML = text;
                listContainer.appendChild(box);
            });
        }
        
        function getPageDisplayName() {
            const path = window.location.pathname;
            let fileName = path.split('/').pop().replace('.html', '').toLowerCase();

            if (!fileName || fileName === '' || fileName === 'index') return 'Home';

            const pageMap = {
                'home': 'Home',
                'docs': 'Dokumentasi',
                'doc': 'Dokumentasi',
                'status': 'Status Server',
                'store': 'Store API',
                'changelog': 'Changelog',
                'uploader': 'Uploader File',
                'pastecode': 'Pastecode',
                'feedback': 'Feedback',
                'privacy': 'Kebijakan Privasi',
                'support': 'Dukungan Support',
                'login': 'Halaman Login'
            };

            if (pageMap[fileName]) return pageMap[fileName];
            return fileName.charAt(0).toUpperCase() + fileName.slice(1);
        }

        const pageName = getPageDisplayName();
        const loaderTitleEl = document.getElementById('loader-title-text');
        if (loaderTitleEl) {
            loaderTitleEl.innerHTML = `Memuat ${pageName}<span class="animated-dots"></span>`;
        }

        // Progress Loader 0% - 100%
        let currentProgress = 0;
        const progressFill = document.getElementById('loader-progress-fill');
        const percentageText = document.getElementById('loader-percentage');
        const loaderOverlay = document.getElementById('cyber-loader-overlay');

        function updateProgress(targetVal) {
            currentProgress = Math.min(Math.max(currentProgress, targetVal), 100);
            if (progressFill) progressFill.style.width = currentProgress + '%';
            if (percentageText) percentageText.innerText = Math.floor(currentProgress) + '%';
        }

        const progressInterval = setInterval(() => {
            if (currentProgress < 85) {
                const increment = Math.random() * 12 + 5;
                updateProgress(currentProgress + increment);
            }
        }, 120);

        window.addEventListener('load', () => {
            clearInterval(progressInterval);
            updateProgress(100);

            setTimeout(() => {
                if (loaderOverlay) loaderOverlay.classList.add('fade-out');
            }, 400);
        });

        // Fallback Safety (Maksimal 4 detik)
        setTimeout(() => {
            clearInterval(progressInterval);
            updateProgress(100);
            if (loaderOverlay && !loaderOverlay.classList.contains('fade-out')) {
                loaderOverlay.classList.add('fade-out');
            }
        }, 4000);

        window.addEventListener('DOMContentLoaded', renderPrivacyContent);
    </script>
</body>
</html>
