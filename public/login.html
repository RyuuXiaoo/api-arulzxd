<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentikasi - ArulzXD REST API</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahan: SweetAlert2 untuk Alert Estetik -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                } 
            }
        }
    </script>
    <style>
        body { 
            background-image: linear-gradient(rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.8)), url('https://arulz-xd.my.id/files/5zkZru.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        /* Glass Card dengan Animasi Glow Border */
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
            animation: cardGlowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes cardGlowPulse {
            0% {
                border-color: rgba(0, 243, 255, 0.25);
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
            }
            50% {
                border-color: rgba(168, 85, 247, 0.35);
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.08);
            }
            100% {
                border-color: rgba(0, 243, 255, 0.4);
                box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 25px rgba(0, 243, 255, 0.1);
            }
        }

        /* Glowing Text FX */
        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6), 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* Glowing Input Focus FX */
        .glow-input:focus {
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            border-color: #00f3ff !important;
        }

        /* Glowing Buttons */
        .glow-btn-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn-cyan:hover {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
            transform: translateY(-1px);
        }

        .glow-btn-purple {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn-purple:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
            transform: translateY(-1px);
        }

        .hidden-form { display: none; }

        /* Styling khusus kustomisasi SweetAlert2 agar tema serasi dengan ArulzXD API */
        .swal2-popup-custom {
            background: rgba(17, 24, 39, 0.95) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.3) !important;
            border-radius: 1.5rem !important;
            color: #f3f4f6 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25) !important;
        }
        .swal2-title-custom {
            color: #ffffff !important;
            font-size: 1.25rem !important;
            font-weight: 800 !important;
        }
        .swal2-html-custom {
            color: #9ca3af !important;
            font-size: 0.875rem !important;
        }
        .swal2-confirm-custom {
            background: linear-gradient(to right, #0891b2, #06b6d4) !important;
            color: #020617 !important;
            font-weight: 700 !important;
            font-size: 0.875rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            padding: 0.75rem 2rem !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 0 15px rgba(8, 145, 178, 0.5) !important;
        }

        :root {
            --neon-cyan: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.4);
            --bg-dark: #030712;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-color: rgba(0, 243, 255, 0.2);
        }

        /* Support Light Theme Mode */
        html.light {
            --neon-cyan: #008b9b;
            --neon-glow: rgba(0, 139, 155, 0.25);
            --bg-dark: #f0fdfa;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 139, 155, 0.3);
        }

        #cyber-loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        #cyber-loader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Laser Scanner Beam */
        .scanner-beam {
            position: absolute;
            top: 0;
            left: -100%;
            width: 300%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.05), transparent);
            animation: scanAnimation 4s infinite linear;
        }
        @keyframes scanAnimation {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Concentric Hologram HUD Rotating Rings */
        .hud-ring {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed var(--neon-cyan);
            opacity: 0.6;
            animation: spinClockwise 10s linear infinite;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .ring-middle {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
            animation: spinCounterClockwise 4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .ring-inner {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 1px dotted var(--neon-cyan);
            opacity: 0.8;
            animation: spinClockwise 6s linear infinite;
        }

        .hud-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            z-index: 10;
        }

        @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 100% { transform: rotate(-360deg); } }

        /* Animated Dot Pulse */
        .animated-dots::after {
            content: '';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotsAnimation 1.5s steps(4, end) infinite;
        }
        @keyframes dotsAnimation {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .neon-progress-bar {
            background: linear-gradient(90deg, #06b6d4, var(--neon-cyan));
            box-shadow: 0 0 12px var(--neon-cyan);
            transition: width 0.15s ease-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 antialiased text-gray-200">
    <div id="cyber-loader-overlay">
        <div class="scanner-beam"></div>

        <!-- Central Holographic HUD Ring Spinner -->
        <div class="hud-ring mb-6">
            <div class="ring-outer"></div>
            <div class="ring-middle"></div>
            <div class="ring-inner"></div>
            <img src="https://arulz-xd.my.id/files/Q2C70y.png" alt="Logo" class="hud-avatar">
        </div>

        <!-- Dynamic Page Name & Animated Dot Text -->
        <div class="text-center px-4">
            <div id="loader-title-text" class="text-sm font-extrabold tracking-widest uppercase text-cyan-400 code-font mb-1">
                Memuat Halaman<span class="animated-dots"></span>
            </div>
            <div class="text-[10px] text-slate-400 font-mono tracking-wider opacity-80 uppercase">
                SYSTEM INITIALIZING // CORE GATEWAY
            </div>
        </div>

        <!-- Progress Bar (0% - 100%) -->
        <div class="w-64 sm:w-80 mt-6">
            <div class="flex items-center justify-between text-xs font-bold code-font mb-2">
                <span class="text-slate-400 text-[10px]">SYSTEM STATUS</span>
                <span id="loader-percentage" class="text-cyan-400 text-sm">0%</span>
            </div>
            <div class="w-full h-2 bg-slate-900/90 rounded-full border border-cyan-500/30 overflow-hidden p-0.5">
                <div id="loader-progress-fill" class="h-full rounded-full neon-progress-bar w-0"></div>
            </div>
        </div>

        <div class="absolute bottom-6 text-[10px] font-mono text-slate-500 uppercase tracking-widest">
            BACKEND DEV - ARULZ-XD API v2.0
        </div>
    </div>

    <div class="glass-card p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
        
        <!-- Ornamen Dekoratif Glowing Bubbles -->
        <div class="absolute -top-10 -right-10 w-36 h-36 bg-cyan-500/20 rounded-full blur-2xl animate-pulse"></div>
        <div class="absolute -bottom-10 -left-10 w-36 h-36 bg-purple-500/20 rounded-full blur-2xl animate-pulse"></div>

        <!-- Logo/Header -->
        <div class="text-center mb-6 relative z-10">
            <h1 class="text-2xl font-extrabold tracking-tight text-white mb-1">
                Arulz<span class="text-cyan-400 glow-text-cyan">XD</span> API
            </h1>
            <p id="form-description" class="text-xs text-gray-400">Masuk untuk mengelola token dan akses API Anda.</p>
        </div>

        <!-- ================= FORM SIGN IN ================= -->
        <div id="signin-form" class="space-y-4 relative z-10">
            <form id="loginForm" action="/auth/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Username / Email</label>
                    <input type="text" name="username" required placeholder="Masukkan username atau email" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Kata Sandi</label>
                        <button type="button" onclick="switchForm('forgot')" class="text-xs font-medium text-cyan-400 hover:underline hover:drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">Lupa Password?</button>
                    </div>
                    <div class="relative">
                        <input id="login-password" type="password" name="password" required placeholder="••••••••" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl pl-4 pr-12 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                        <button type="button" onclick="togglePassword('login-password', 'eye-icon-login')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-cyan-400 transition">
                            <svg id="eye-icon-login" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="glow-btn-cyan w-full bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm tracking-wide uppercase">Masuk</button>
            </form>

            <!-- Oauth Divider -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-white/5"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-[10px] font-bold tracking-widest uppercase">Atau masuk dengan</span>
                <div class="flex-grow border-t border-white/5"></div>
            </div>

            <!-- OAuth Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <a href="/auth/google" class="flex items-center justify-center gap-2 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-cyan-500/50 py-2.5 rounded-xl text-xs font-semibold transition text-white hover:shadow-[0_0_12px_rgba(0,243,255,0.2)]">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-4 h-4" alt="Google"> Google
                </a>
                <a href="/auth/github" class="flex items-center justify-center gap-2 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-purple-500/50 py-2.5 rounded-xl text-xs font-semibold transition text-white hover:shadow-[0_0_12px_rgba(168,85,247,0.2)]">
                    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" class="w-4 h-4 invert" alt="GitHub"> GitHub
                </a>
            </div>

            <p class="text-center text-xs text-gray-400 mt-4">Belum punya akun? <button onclick="switchForm('signup')" class="text-cyan-400 font-bold hover:underline hover:drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">Daftar sekarang</button></p>
        </div>

        <!-- ================= FORM SIGN UP ================= -->
        <div id="signup-form" class="space-y-4 relative z-10 hidden-form">
            <form id="registerForm" action="/auth/register" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Username</label>
                    <input type="text" name="username" required placeholder="pilih username" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Alamat Email</label>
                    <input type="email" name="email" required placeholder="nama@email.com" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <input id="register-password" type="password" name="password" required placeholder="••••••••" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl pl-4 pr-12 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                        <button type="button" onclick="togglePassword('register-password', 'eye-icon-register')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-purple-400 transition">
                            <svg id="eye-icon-register" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="glow-btn-purple w-full bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white font-bold py-3 rounded-xl text-sm tracking-wide uppercase">Buat Akun Baru</button>
            </form>
            <p class="text-center text-xs text-gray-400 mt-4">Sudah punya akun? <button onclick="switchForm('signin')" class="text-cyan-400 font-bold hover:underline hover:drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">Masuk</button></p>
        </div>

        <!-- ================= FORM FORGOT PASSWORD ================= -->
        <div id="forgot-form" class="space-y-4 relative z-10 hidden-form">
            <form id="forgotForm" action="/auth/forgot-password" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Alamat Email Terdaftar</label>
                    <input type="email" name="email" required placeholder="nama@email.com" class="glow-input w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none font-medium transition">
                </div>
                <button type="submit" class="glow-btn-cyan w-full bg-gradient-to-r from-zinc-700 to-zinc-600 hover:from-zinc-600 hover:to-zinc-500 text-white font-bold py-3 rounded-xl text-sm tracking-wide uppercase">Kirim Instruksi Reset</button>
            </form>
            <p class="text-center text-xs text-gray-400 mt-4"><button onclick="switchForm('signin')" class="text-cyan-400 font-bold hover:underline hover:drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">Kembali ke Halaman Login</button></p>
        </div>

    </div>

    <!-- JavaScript Logika Form dan Show/Hide Password -->
    <script>
        // Konfigurasi Dasar Custom Classes SweetAlert2
        const swalConfig = {
            customClass: {
                popup: 'swal2-popup-custom',
                title: 'swal2-title-custom',
                htmlContainer: 'swal2-html-custom',
                confirmButton: 'swal2-confirm-custom'
            },
            buttonsStyling: false
        };

        // Fungsi Utama Show/Hide Password
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                `;
            }
        }

        // Fungsi Switch Form
        function switchForm(formType) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const forgotForm = document.getElementById('forgot-form');
            const description = document.getElementById('form-description');

            signinForm.classList.add('hidden-form');
            signupForm.classList.add('hidden-form');
            forgotForm.classList.add('hidden-form');

            if (formType === 'signin') {
                signinForm.classList.remove('hidden-form');
                description.innerText = "Masuk untuk mengelola token dan akses API Anda.";
            } else if (formType === 'signup') {
                signupForm.classList.remove('hidden-form');
                description.innerText = "Daftarkan akun baru Anda untuk mendapatkan API Key gratis.";
            } else if (formType === 'forgot') {
                forgotForm.classList.remove('hidden-form');
                description.innerText = "Masukkan email Anda untuk memproses penyetelan ulang sandi.";
            }
        }

        // --- INTERSEPT SUBMIT & SWEETALERT LOGIC ---

        // 1. Alert Form Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'success',
                iconColor: '#06b6d4',
                title: 'Autentikasi Berhasil',
                text: 'Memproses login Anda, mohon tunggu...',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                e.target.submit();
            });
        });

        // 2. Alert Form Register
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'success',
                iconColor: '#a855f7', // Warna ungu mengikuti tema registrasi Anda
                title: 'Pendaftaran Berhasil',
                text: 'Akun Anda berhasil dibuat! Mengalihkan ke dashboard...',
                confirmButtonText: 'Lanjutkan'
            }).then((result) => {
                if (result.isConfirmed) {
                    e.target.submit();
                }
            });
        });

        // 3. Alert Form Lupa Password
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                ...swalConfig,
                icon: 'info',
                iconColor: '#3b82f6',
                title: 'Instruksi Dikirim',
                text: 'Silakan periksa kotak masuk email Anda untuk menyetel ulang kata sandi.',
                confirmButtonText: 'Mengerti'
            }).then((result) => {
                if (result.isConfirmed) {
                    e.target.submit();
                }
            });
        });

        function getPageDisplayName() {
            const path = window.location.pathname;
            let fileName = path.split('/').pop().replace('.html', '').toLowerCase();

            if (!fileName || fileName === '' || fileName === 'index') return 'Home';

            const pageMap = {
                'home': 'Home',
                'docs': 'Dokumentasi',
                'doc': 'Dokumentasi',
                'status': 'Status Server',
                'store': 'Store API',
                'changelog': 'Changelog',
                'uploader': 'Uploader File',
                'pastecode': 'Pastecode',
                'feedback': 'Feedback',
                'privacy': 'Kebijakan Privasi',
                'support': 'Dukungan Support',
                'login': 'Halaman Login'
            };

            if (pageMap[fileName]) return pageMap[fileName];
            return fileName.charAt(0).toUpperCase() + fileName.slice(1);
        }

        const pageName = getPageDisplayName();
        const loaderTitleEl = document.getElementById('loader-title-text');
        if (loaderTitleEl) {
            loaderTitleEl.innerHTML = `Memuat ${pageName}<span class="animated-dots"></span>`;
        }

        // Progress Loader 0% - 100%
        let currentProgress = 0;
        const progressFill = document.getElementById('loader-progress-fill');
        const percentageText = document.getElementById('loader-percentage');
        const loaderOverlay = document.getElementById('cyber-loader-overlay');

        function updateProgress(targetVal) {
            currentProgress = Math.min(Math.max(currentProgress, targetVal), 100);
            if (progressFill) progressFill.style.width = currentProgress + '%';
            if (percentageText) percentageText.innerText = Math.floor(currentProgress) + '%';
        }

        const progressInterval = setInterval(() => {
            if (currentProgress < 85) {
                const increment = Math.random() * 12 + 5;
                updateProgress(currentProgress + increment);
            }
        }, 120);

        window.addEventListener('load', () => {
            clearInterval(progressInterval);
            updateProgress(100);

            setTimeout(() => {
                if (loaderOverlay) loaderOverlay.classList.add('fade-out');
            }, 400);
        });

        // Fallback Safety (Maksimal 4 detik)
        setTimeout(() => {
            clearInterval(progressInterval);
            updateProgress(100);
            if (loaderOverlay && !loaderOverlay.classList.contains('fade-out')) {
                loaderOverlay.classList.add('fade-out');
            }
        }, 4000);
    </script>
</body>
</html>
