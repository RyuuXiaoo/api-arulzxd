<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog - ArulzXD API</title>
    <link rel="icon" href="https://arulz-xd.my.id/files/Q2C70y.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            font-family: 'Space Grotesk', sans-serif;
            color: #f8fafc;
        }
        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: #0b1329;
            border: 1px solid rgba(6, 182, 212, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 15px rgba(6, 182, 212, 0.05);
            border-radius: 16px;
        }
        .glass-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.1);
        }
         :root {
        --neon-cyan: #00f3ff;
        --neon-glow: rgba(0, 243, 255, 0.4);
        --bg-dark: #030712;
        --bg-card: rgba(15, 23, 42, 0.75);
        --border-color: rgba(0, 243, 255, 0.2);
    }

    /* Support Light Theme Mode */
    html.light {
        --neon-cyan: #008b9b;
        --neon-glow: rgba(0, 139, 155, 0.25);
        --bg-dark: #f0fdfa;
        --bg-card: rgba(255, 255, 255, 0.85);
        --border-color: rgba(0, 139, 155, 0.3);
    }

    #cyber-loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: var(--bg-dark);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
    }

    #cyber-loader-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    /* Laser Scanner Beam */
    .scanner-beam {
        position: absolute;
        top: 0;
        left: -100%;
        width: 300%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.05), transparent);
        animation: scanAnimation 4s infinite linear;
    }
    @keyframes scanAnimation {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
    }

    /* Concentric Hologram HUD Rotating Rings */
    .hud-ring {
        position: relative;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed var(--neon-cyan);
        opacity: 0.6;
        animation: spinClockwise 10s linear infinite;
        box-shadow: 0 0 15px var(--neon-glow);
    }

    .ring-middle {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--neon-cyan);
        border-bottom-color: var(--neon-cyan);
        animation: spinCounterClockwise 4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .ring-inner {
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        border: 1px dotted var(--neon-cyan);
        opacity: 0.8;
        animation: spinClockwise 6s linear infinite;
    }

    .hud-avatar {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--neon-cyan);
        box-shadow: 0 0 20px var(--neon-cyan);
        z-index: 10;
    }

    @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
    @keyframes spinCounterClockwise { 100% { transform: rotate(-360deg); } }

    /* Animated Dot Pulse */
    .animated-dots::after {
        content: '';
        display: inline-block;
        width: 1.5em;
        text-align: left;
        animation: dotsAnimation 1.5s steps(4, end) infinite;
    }
    @keyframes dotsAnimation {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
    }

    .neon-progress-bar {
        background: linear-gradient(90deg, #06b6d4, var(--neon-cyan));
        box-shadow: 0 0 12px var(--neon-cyan);
        transition: width 0.15s ease-out;
    }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased">

    <div id="cyber-loader-overlay">
    <div class="scanner-beam"></div>

    <!-- Central Holographic HUD Ring Spinner -->
    <div class="hud-ring mb-6">
        <div class="ring-outer"></div>
        <div class="ring-middle"></div>
        <div class="ring-inner"></div>
        <img src="https://arulz-xd.my.id/files/Q2C70y.png" alt="Logo" class="hud-avatar">
    </div>

    <!-- Dynamic Page Name & Animated Dot Text -->
    <div class="text-center px-4">
        <div id="loader-title-text" class="text-sm font-extrabold tracking-widest uppercase text-cyan-400 code-font mb-1">
            Memuat Halaman<span class="animated-dots"></span>
        </div>
        <div class="text-[10px] text-slate-400 font-mono tracking-wider opacity-80 uppercase">
            SYSTEM INITIALIZING // CORE GATEWAY
        </div>
    </div>

    <!-- Progress Bar (0% - 100%) -->
    <div class="w-64 sm:w-80 mt-6">
        <div class="flex items-center justify-between text-xs font-bold code-font mb-2">
            <span class="text-slate-400 text-[10px]">SYSTEM STATUS</span>
            <span id="loader-percentage" class="text-cyan-400 text-sm">0%</span>
        </div>
        <div class="w-full h-2 bg-slate-900/90 rounded-full border border-cyan-500/30 overflow-hidden p-0.5">
            <div id="loader-progress-fill" class="h-full rounded-full neon-progress-bar w-0"></div>
        </div>
    </div>

    <div class="absolute bottom-6 text-[10px] font-mono text-slate-500 uppercase tracking-widest">
        BACKEND DEV - ARULZ-XD API v2.0
    </div>
</div>

    <!-- Sticky Navigation Header -->
    <header class="sticky top-0 z-50 bg-[#020617]/80 backdrop-blur-md border-b border-cyan-500/10 px-4 py-3">
        <div class="max-w-3xl mx-auto flex justify-between items-center gap-3">
            <a href="/" class="glass-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-200 hover:text-cyan-400 flex items-center gap-2 transition-all shadow-md">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="/docs" class="glass-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-200 hover:text-cyan-400 flex items-center gap-2 transition-all shadow-md">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span>Documentation</span>
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-3xl mx-auto px-4 mt-8">
        
        <!-- Header Section -->
        <div class="mb-8 text-left">
            <span class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 font-bold text-[10px] tracking-widest uppercase rounded-full mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> SYSTEM UPDATES
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">Changelog</h1>
            <p class="text-xs sm:text-sm text-slate-400 leading-relaxed font-normal">
                Catatan otomatis mengenai pembaruan protokol, perbaikan bug, dan rilis fitur REST API dari cluster infrastruktur.
            </p>
        </div>

        <!-- Dynamic Changelog Timeline Container -->
        <div class="relative space-y-8" id="changelog-container">
            <div id="loading" class="text-center py-12 font-mono-custom text-xs text-cyan-400 font-bold">
                [ LOADING PROTOCOL DATA... ]
            </div>
        </div>

    </main>

    <script>
        async function loadChangelog() {
    try {
        const res = await fetch('/database/changelog');
        const data = await res.json();
        
        const container = document.getElementById('changelog-container');
        container.innerHTML = '';

        data.forEach((item, index) => {
            const isLast = index === data.length - 1;
            const type = item.type ? item.type.toLowerCase() : '';

            // Pengondisian Warna & Label Tipe Pembaruan
            let dotBg = 'bg-cyan-400';
            let badgeClass = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
            let typeLabel = item.type ? item.type.toUpperCase() : 'UPDATE';

            if (type === 'add' || type === 'added') {
                dotBg = 'bg-emerald-400';
                badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                typeLabel = 'ADD';
            } else if (type === 'delete' || type === 'deleted' || type === 'remove') {
                dotBg = 'bg-rose-500';
                badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                typeLabel = 'DELETE';
            } else if (type === 'bug fix' || type === 'fix' || type === 'bugfix') {
                dotBg = 'bg-amber-400';
                badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                typeLabel = 'BUG FIX';
            } else if (type === 'feature') {
                dotBg = 'bg-indigo-400';
                badgeClass = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30';
                typeLabel = 'FEATURE';
            }

            const cardHTML = `
                <div class="relative pl-9 sm:pl-10">
                    <!-- Timeline Line -->
                    ${!isLast ? '<div class="absolute left-[15px] sm:left-[17px] top-8 bottom-[-32px] w-[2px] bg-gradient-to-b from-cyan-500/40 via-cyan-500/10 to-transparent"></div>' : ''}

                    <!-- Dot Icon Marker -->
                    <div class="absolute left-0 top-1 w-8 h-8 rounded-full border border-cyan-500/30 bg-[#020617] flex items-center justify-center z-10 shadow-lg">
                        <div class="w-2.5 h-2.5 rounded-full ${dotBg} shadow-[0_0_8px_rgba(34,211,238,0.5)]"></div>
                    </div>

                    <!-- Header Version Tag & Date -->
                    <div class="flex items-center gap-2 mb-2 font-mono-custom text-xs">
                        <span class="px-2 py-0.5 border border-cyan-500/30 rounded-md text-[11px] font-bold text-cyan-400 bg-cyan-950/30">${item.version}</span>
                        <span class="text-slate-400 font-medium text-[11px]">${item.date}</span>
                        <span class="text-slate-600">•</span>
                        <span class="px-2 py-0.5 border rounded-md text-[9px] font-extrabold tracking-wider uppercase ${badgeClass}">${typeLabel}</span>
                    </div>

                    <!-- Content Card -->
                    <div class="glass-panel p-5 sm:p-6 transition-all duration-300 hover:border-cyan-500/30">
                        <h2 class="text-base sm:text-lg font-bold text-white mb-2 tracking-wide">${item.title}</h2>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal mb-4">
                            ${item.description}
                        </p>
                        
                        <hr class="border-white/5 mb-3">

                        <div class="flex justify-between items-center text-[10px] sm:text-[11px] font-mono-custom text-slate-400">
                            <div class="flex items-center gap-1.5 text-cyan-400 font-semibold">
                                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                </svg>
                                <span>PROTOCOL VERIFIED</span>
                            </div>
                            ${item.node ? `<span class="opacity-80">NODE: ${item.node}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    } catch (err) {
        console.error('Error fetching changelog:', err);
    }
}

        document.addEventListener('DOMContentLoaded', loadChangelog);
        function getPageDisplayName() {
        const path = window.location.pathname;
        let fileName = path.split('/').pop().replace('.html', '').toLowerCase();

        if (!fileName || fileName === '' || fileName === 'index') return 'Home';

        const pageMap = {
            'home': 'Home',
            'docs': 'Dokumentasi',
            'doc': 'Dokumentasi',
            'status': 'Status Server',
            'store': 'Store API',
            'changelog': 'Changelog',
            'uploader': 'Uploader File',
            'pastecode': 'Pastecode',
            'feedback': 'Feedback',
            'privacy': 'Kebijakan Privasi',
            'support': 'Dukungan Support',
            'login': 'Halaman Login'
        };

        if (pageMap[fileName]) return pageMap[fileName];
        return fileName.charAt(0).toUpperCase() + fileName.slice(1);
    }

    const pageName = getPageDisplayName();
    const loaderTitleEl = document.getElementById('loader-title-text');
    if (loaderTitleEl) {
        loaderTitleEl.innerHTML = `Memuat ${pageName}<span class="animated-dots"></span>`;
    }

    // Progress Loader 0% - 100%
    let currentProgress = 0;
    const progressFill = document.getElementById('loader-progress-fill');
    const percentageText = document.getElementById('loader-percentage');
    const loaderOverlay = document.getElementById('cyber-loader-overlay');

    function updateProgress(targetVal) {
        currentProgress = Math.min(Math.max(currentProgress, targetVal), 100);
        if (progressFill) progressFill.style.width = currentProgress + '%';
        if (percentageText) percentageText.innerText = Math.floor(currentProgress) + '%';
    }

    const progressInterval = setInterval(() => {
        if (currentProgress < 85) {
            const increment = Math.random() * 12 + 5;
            updateProgress(currentProgress + increment);
        }
    }, 120);

    window.addEventListener('load', () => {
        clearInterval(progressInterval);
        updateProgress(100);

        setTimeout(() => {
            if (loaderOverlay) loaderOverlay.classList.add('fade-out');
        }, 400);
    });

    // Fallback Safety (Maksimal 4 detik)
    setTimeout(() => {
        clearInterval(progressInterval);
        updateProgress(100);
        if (loaderOverlay && !loaderOverlay.classList.contains('fade-out')) {
            loaderOverlay.classList.add('fade-out');
        }
    }, 4000);
    </script>
</body>
</html>
